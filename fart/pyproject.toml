[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity"
version = "0.1.0"
description = "Antigravity MCP Server and Customization Plugin with MicroVM Sandbox & Execution Engine and Scheduled Background Service Workers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Antigravity Team" }
]
keywords = ["mcp", "sandbox", "microvm", "e2b", "scheduler", "agents", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
scheduler = [
    "croniter>=2.0.0",
]
mcp = [
    "mcp>=1.0.0",
]
e2b = [
    "e2b-code-interpreter>=1.0.0",
    "e2b>=1.0.0",
]
all = [
    "croniter>=2.0.0",
    "mcp>=1.0.0",
    "e2b-code-interpreter>=1.0.0",
    "e2b>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
